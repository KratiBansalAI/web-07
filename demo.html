<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: beige;
            text-align: center;
        }
        main {
            width: 960px;
            height: 1000px;
            background-color: antiquewhite;
            margin: 0 auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header {
            width: 960px;
            height: 100px;
            background-color: rgb(168, 210, 210);
        }
        nav {
            width: 960px;
            height: 80px;
            background-color: rgb(168, 210, 210);

        } 
        section {
            width: 960px;
            height: 400px;
            display: flex;
            flex-direction: row;
            column-gap: 10px;

        }
        #left {
            flex-grow: 1;
            background-color: rgb(185, 181, 181);
        }
        #right {
            flex-grow: 2;
            background-color: rgb(185, 183, 183);
            display: flex;
            flex-direction: column;
            gap: 10px;
            row-gap: 10px;
        }
        Aside,Article{
            background-color: antiquewhite;
            flex-grow: 1;
        }
        footer {
            width: 960px;
            height: 50px;
            background-color: rgb(168, 210, 210);
        }
    </style>
</head>
<body>
    <main>
        <!--header-->
        <header>
            <h2>Header</h2>

        </header>
        <!--nav-->
        <nav>
            <h2>Navbar</h2>
        </nav>

        <!--section-->
        <section>
            <div id ="left">

            </div>
            <div id="right">
                <h2>Aside</h2>


                <h2>Article</h2>

            </div>
        </section>

        <!--footer-->
        <footer>
            <h2>Footer</h2>
        </footer>
    </main>
</body>
</html>
