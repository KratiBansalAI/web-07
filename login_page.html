<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
</head>
<body style="background-color:#eef2f7; font-family:Arial, sans-serif; text-align:center; padding:50px; box-sizing: content-box;">

<h1>Login Page</h1>

<form method="get" autocomplete="on">

    <label>Username:</label>
    <input type="text" name="username" placeholder="Enter username" minlength="4" maxlength="30" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" placeholder="Enter password" minlength="8" maxlength="20" required
    title="Password should be 8 to 20 characters long and must include both letters and numbers">
    <br><br>

    <button type="submit"><a href="resume.html">Login</a></button>
    <button type="submit"><a href="registration_form.html">Sign In</a></button>
</form>

</body>
</html>
